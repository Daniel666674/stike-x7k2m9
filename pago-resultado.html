<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Resultado del pago: Stike Bike Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=378f57df8c">
  <link rel="icon" href="assets/img/favicon.png">
</head>
<body>
  <div id="site-header"></div>

  <div class="wrap page-head">
    <nav class="breadcrumb"><a href="index.html">Inicio</a><span class="sep">/</span><span>Resultado del pago</span></nav>
  </div>

  <div class="wrap" style="max-width:520px;padding:40px 0 80px">
    <div id="result-mount" class="co-success">
      <p>Verificando tu pago…</p>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="assets/js/products-data.js?v=c7dfde4545"></script>
  <script src="assets/js/data.js?v=79ae087066"></script>
  <script src="assets/js/app.js?v=de4887584b"></script>
  <script src="assets/js/analytics.js?v=7913e5666f" defer></script>
  <script src="assets/js/wompi.js?v=583a36d730"></script>
  <script>
    stikeInit();

    /* Rutas del backend de pagos: ver assets/js/wompi.js (STIKE_WOMPI_API). */
    const STATUS_ENDPOINT = STIKE_WOMPI_API.status;
    const mount = document.getElementById("result-mount");

    function renderState({ icon, title, orderNo, message, extra, actionHref, actionLabel }) {
      mount.innerHTML = `
        <div class="co-check">${icon}</div>
        <h3>${title}</h3>
        ${orderNo ? `<div class="co-order-no">Referencia ${orderNo}</div>` : ""}
        <p>${message}</p>
        ${extra || ""}
        <a class="btn block" href="${actionHref}">${actionLabel}</a>`;
    }

    const CHECK_SVG = `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`;
    const X_SVG = `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    const CLOCK_SVG = `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;

    /* Consulta el estado a nuestro servidor (que le pregunta a Wompi con la
       llave privada). Lanza si no se pudo confirmar. */
    async function fetchTxn(id) {
      const res = await fetch(`${STATUS_ENDPOINT}?id=${encodeURIComponent(id)}`, { cache: "no-store" });
      const body = await res.json().catch(() => null);
      if (!res.ok || !body) { const e = new Error((body && body.error) || `HTTP ${res.status}`); e.code = (body && body.error) || `http_${res.status}`; throw e; }
      return body.data || body;
    }
    /* Recien pagado, Wompi puede tardar unos segundos en dejar ver la transaccion (o fallar un instante):
       antes de decir que no se pudo confirmar se reintenta ~25 segundos. */
    async function fetchTxnPatient(id) {
      let last;
      for (let i = 0; i < 9; i++) {
        try { return await fetchTxn(id); }
        catch (e) { last = e; if (e.code === "invalid_transaction_id") break; await sleep(i < 2 ? 1500 : 3000); }
      }
      throw last;
    }
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const escHtml = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    /* PSE y Nequi quedan PENDING hasta que el banco / la app confirman (de
       segundos a unos minutos). Mientras la pestana siga abierta se vuelve a
       preguntar; si se cierra, el webhook (api/wompi-events) registra el
       pedido igual cuando Wompi lo apruebe. */
    const POLL_EVERY_MS = 5000, POLL_FOR_MS = 180000;

    function waLink(text) { return `https://wa.me/${STIKE_CONFIG.whatsapp}?text=${text}`; }

    function showApproved(txn, id) {
      const ref = txn.reference || id;
      /* El carrito en localStorage sigue intacto hasta este punto -- es la
         unica fuente que sabe QUE se compro en el navegador (Wompi solo
         conoce referencia y monto). Lo leemos antes de vaciarlo para armar
         el aviso por WhatsApp. El registro de la venta NO sale de aca: el
         servidor ya guardo el pedido al firmar, y lo registra al confirmar
         el pago con Wompi (wompi-order / wompi-events). */
      const cart = stikeGetCart();
      const shipInfo = stikeGetShipping();
      const waLines = cart.map(r => {
        const p = stikeFindProduct(r.slug);
        if (!p) return "";
        const variantBits = [];
        if (r.size) variantBits.push(`Talla ${r.size}`);
        if (r.color) variantBits.push(`Color ${r.color}`);
        const variant = variantBits.length ? ` (${variantBits.join(", ")})` : "";
        return `• ${r.qty}x ${p.n}${variant}, ${stikePrice(stikePriceFor(p, r.size || null, r.color || null) * r.qty)}`;
      }).filter(Boolean).join("\n");
      const amountPesos = Math.round((txn.amount_in_cents || 0) / 100);
      /* Medicion (assets/js/analytics.js): la compra se cuenta UNA vez, con el pago ya APROBADO, su referencia, el valor cobrado y
         lo que habia en el carrito (que se vacia mas abajo). Recargar esta pagina no la cuenta otra vez. */
      try { document.dispatchEvent(new CustomEvent("stike:purchase", { detail: { reference: ref, value: amountPesos, items: cart.map(r => ({ slug: r.slug, qty: r.qty, size: r.size || null, color: r.color || null })) } })); } catch (e) {}
      const shipLines = shipInfo
        ? `\n\nEnviar a:\n${shipInfo.name} - ${shipInfo.phone}\n${shipInfo.address}, ${shipInfo.city}` + (shipInfo.notes ? `\nNotas: ${shipInfo.notes}` : "")
        : "";
      /* Todo el mensaje se codifica junto: una direccion con «#» (Calle 1 # 2-3) cortaba el mensaje de WhatsApp en ese caracter. */
      const waMsg = encodeURIComponent(`Hola Stike! Ya pague mi pedido por Wompi.\nReferencia: ${ref}\n${waLines}\n\nTotal pagado (solo productos): ${stikePrice(amountPesos)}${shipLines}\n\nQuiero que me cotices el envío (va por mi cuenta).`);

      /* Solo la referencia y el id: el servidor ignora cualquier otro dato del navegador. */
      /* Si el servidor falla un momento (hosting lento, disco ocupado) se reintenta 3 veces; el registro es
         idempotente, asi que repetir no duplica la venta. Un 4xx no se reintenta (no va a cambiar). */
      (async () => {
        for (let attempt = 1; attempt <= 3; attempt++) {
          try {
            const r = await fetch(STIKE_WOMPI_API.order, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ reference: ref, wompiId: id }),
            });
            if (r.ok || (r.status >= 400 && r.status < 500)) { if (!r.ok) console.error("wompi-order respondio", r.status); return; }
            console.error("wompi-order respondio", r.status, "(intento " + attempt + ")");
          } catch (err) { console.error("wompi-order (registro de venta):", err); }
          await sleep(2500 * attempt);
        }
      })();

      stikeSaveCart([]);
      stikeClearShipping();
      renderState({
        icon: CHECK_SVG, title: "¡Pago exitoso!", orderNo: ref,
        message: "Pagaste tus productos. <b>Falta el envío</b>: lo calculamos según tu ciudad y te lo compartimos por <b>WhatsApp</b>. El envío no estaba incluido en este pago y <b>corre por cuenta del cliente</b>; despachamos cuando lo confirmes y lo pagues. Para ir más rápido, escríbenos tú ahora:",
        extra: `<a class="btn wa block" style="margin-bottom:10px" href="${waLink(waMsg)}" target="_blank" rel="noopener">Pedir el valor del envío por WhatsApp</a>`,
        actionHref: "tienda.html", actionLabel: "Volver a la tienda",
      });
    }

    async function run() {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      if (!id) {
        renderState({
          icon: X_SVG, title: "No encontramos tu pago",
          message: "Si acabas de pagar, escríbenos por WhatsApp con tu comprobante y lo confirmamos a mano.",
          actionHref: `https://wa.me/${STIKE_CONFIG.whatsapp}`, actionLabel: "Escribir por WhatsApp",
        });
        return;
      }

      let txn;
      renderState({
        icon: CLOCK_SVG, title: "Confirmando tu pago…",
        message: "Estamos confirmando tu pago con Wompi. No cierres esta página.",
        actionHref: "tienda.html", actionLabel: "Volver a la tienda",
      });
      try {
        txn = await fetchTxnPatient(id);
      } catch (err) {
        /* El dinero pudo haber entrado: se muestra el id para que se pueda reconciliar rapido, y el mensaje de WhatsApp ya lo lleva. */
        const wa = encodeURIComponent(`Hola Stike! Pagué por Wompi y la página no pudo confirmarlo.%0AID de la transacción: ${id}`.replace(/%0A/g, "\n"));
        renderState({
          icon: X_SVG, title: "No pudimos confirmar el pago",
          message: "Si el pago salió de tu cuenta, no lo repitas: escríbenos por WhatsApp y lo confirmamos a mano enseguida.",
          extra: `<p style="font-size:12.5px;color:var(--muted);margin:0 0 16px">ID de la transacción: <b>${escHtml(id)}</b> · código: ${escHtml((err && err.code) || "desconocido")}</p>`,
          actionHref: `https://wa.me/${STIKE_CONFIG.whatsapp}?text=${wa}`, actionLabel: "Escribir por WhatsApp",
        });
        return;
      }

      if (txn.status === "PENDING") {
        const ref = txn.reference || id;
        renderState({
          icon: CLOCK_SVG, title: "Confirmando tu pago…", orderNo: ref,
          message: "Tu banco o Nequi todavía no responde. No cierres esta página: apenas lo confirme te lo mostramos aquí.",
          actionHref: "tienda.html", actionLabel: "Volver a la tienda",
        });
        const until = Date.now() + POLL_FOR_MS;
        while (txn.status === "PENDING" && Date.now() < until) {
          await sleep(POLL_EVERY_MS);
          try { txn = await fetchTxn(id); } catch (e) { /* un fallo suelto no corta la espera */ }
        }
      }

      const ref = txn.reference || id;
      if (txn.status === "APPROVED") {
        showApproved(txn, id);
      } else if (txn.status === "PENDING") {
        renderState({
          icon: CLOCK_SVG, title: "Tu pago sigue en proceso", orderNo: ref,
          message: "Algunos bancos y Nequi tardan más de lo normal. No tienes que hacer nada: apenas el pago se confirme registramos tu pedido automáticamente. Si en un rato no te escribimos, avísanos por WhatsApp con tu referencia.",
          extra: `<a class="btn wa block" style="margin-bottom:10px" href="${waLink(`Hola Stike! Mi pago por Wompi sigue en proceso.%0AReferencia: ${ref}`)}" target="_blank" rel="noopener">Escribir por WhatsApp</a>`,
          actionHref: "tienda.html", actionLabel: "Volver a la tienda",
        });
      } else {
        try { document.dispatchEvent(new CustomEvent("stike:payment_failed", { detail: { reference: ref, status: txn.status } })); } catch (e) {}
        renderState({
          icon: X_SVG, title: "El pago no se completó", orderNo: ref,
          message: "El pago no fue aprobado, así que no se hizo ningún cobro definitivo (si ves un valor retenido, tu banco lo libera solo en unos días). Tu carrito sigue como lo dejaste: puedes intentarlo de nuevo, con otro medio de pago si prefieres.",
          actionHref: "carrito.html", actionLabel: "Volver al carrito",
        });
      }
    }
    run();
  </script>
  <script src="assets/js/animations.js?v=1778242806"></script>
</body>
</html>
