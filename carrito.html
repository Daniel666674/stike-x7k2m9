    <h1>Tu carrito</h1>

  <div class="wrap" id="cart-mount"></div>

  <div id="site-footer"></div>

  <script src="assets/js/products-data.js?v=edafa9f627"></script>
  <script src="assets/js/data.js?v=6f7d5dc8a6"></script>
  <script src="assets/js/app.js?v=f8bcda3447"></script>
  <script src="assets/js/wompi.js?v=6e88634b39"></script>
  <script>
    stikeInit();
    const FREE_SHIP = 300000;
    const SHIP_COST = 18000;

    /* ------------------------------- Pago -------------------------------
       El boton manda al checkout de Wompi (widget embebido; si no carga,
       redireccion), ver assets/js/wompi.js. La firma y el monto los calcula
       el servidor (api/wompi-sign.php) con el catalogo: el navegador solo
       dice QUE se compra. La venta se registra cuando Wompi confirma el
       dinero (api/wompi-events.php / api/wompi-order.php), nunca aca.

       No hay pasarela de mentira de respaldo: si el pago en linea no se
       puede iniciar, se le dice al cliente y se le ofrece WhatsApp. */
    /* El pago en si no dice a donde entregar -- Wompi solo sabe monto y
       referencia -- asi que estos datos se piden aca, antes de salir del
       sitio, y se guardan en localStorage (sobreviven el viaje de ida y
       vuelta a checkout.wompi.co) para que pago-resultado.html los pueda
       mandar junto con el pedido. */
    function readShippingForm() {
      const name = $ship("ship-name"), phone = $ship("ship-phone"), address = $ship("ship-address"), city = $ship("ship-city");
      if (!name.value.trim() || !phone.value.trim() || !address.value.trim() || !city.value.trim()) {
        const firstEmpty = [name, phone, address, city].find(el => !el.value.trim());
        firstEmpty.focus();
        stikeToast("Completa tus datos de envío antes de pagar");
        return null;
      }
      return {
        name: name.value.trim(), phone: phone.value.trim(),
        address: address.value.trim(), city: city.value.trim(),
        notes: $ship("ship-notes").value.trim(),
      };
    }
    function $ship(id) { return document.getElementById(id); }

    /* Mensajes de error del pago, en palabras del cliente. El codigo tecnico
       se muestra al final para que, si pasa, soporte sepa que fue. */
    const PAY_DOWN = ["server_not_configured", "server_misconfigured", "storage_unavailable", "catalog_parse_failed", "internal_error", "github_not_configured"];
    function payErrorMessage(err) {
      const code = (err && err.code) || "";
      const prod = STIKE_PRODUCTS.find(p => p.slug === err.detail);
      if (code === "price_mismatch") return "Los precios cambiaron. Actualizamos tu carrito: revisa el total y vuelve a pagar.";
      if (code === "out_of_stock") return `No hay suficientes unidades de ${prod ? "«" + prod.n + "»" : "un producto"}. Ajusta la cantidad en el carrito.`;
      if (["unknown_product", "product_without_price", "invalid_item", "invalid_qty", "empty_order", "too_many_lines"].includes(code))
        return "Algo de tu carrito cambió y lo actualizamos. Revísalo y vuelve a pagar.";
      if (code === "missing_shipping") return "Completa tus datos de envío (nombre, teléfono, dirección y ciudad) antes de pagar.";
      if (code === "network") return "No pudimos conectar con el servidor. Revisa tu internet e inténtalo de nuevo.";
      if (PAY_DOWN.includes(code)) return `El pago en línea no está disponible en este momento (código ${code}). Escríbenos por WhatsApp y te ayudamos a completar tu pedido.`;
      return `No pudimos iniciar el pago${code ? " (código " + code + ")" : ""}. Inténtalo de nuevo o escríbenos por WhatsApp.`;
    }
    function showPayError(msg) {
      const box = document.getElementById("pay-error");
      if (!box) { stikeToast(msg); return; }
      box.innerHTML = `${msg} <a href="https://wa.me/${STIKE_CONFIG.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>`;
      box.hidden = false;
      box.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    let paying = false;
    function handlePagarAhora(total) {
      if (paying) return;
      /* Antes de cobrar: el carrito tiene que ser uno que el servidor acepte. */
      const clean = stikeSanitizeCart(stikeGetCart());
      if (clean.changed) {
        stikeSaveCart(clean.cart);
        cartNotes = clean.notes;
        render();
        showPayError("Actualizamos tu carrito (ver arriba). Revisa el total y vuelve a pagar.");
        return;
      }
      const shipInfo = readShippingForm();
      if (!shipInfo) return;
      stikeSaveShipping(shipInfo);
      if (typeof stikeWompiCheckout !== "function") {
        showPayError("No pudimos cargar el pago en línea. Recarga la página; si sigue igual, escríbenos por WhatsApp.");
        return;
      }

      const btn = document.getElementById("pay-btn");
      const setBusy = busy => {
        paying = busy;
        if (btn) { btn.disabled = busy; btn.textContent = busy ? "Abriendo el pago…" : "Pagar ahora"; }
      };
      const box = document.getElementById("pay-error");
      if (box) box.hidden = true;
      setBusy(true);
      stikeWompiCheckout(stikeGetCart(), total, { shipping: shipInfo }).then(() => {
        /* El widget ya se abrio: se libera el boton por si el cliente lo cierra y reintenta. */
        setTimeout(() => setBusy(false), 1500);
      }).catch(err => {
        console.error("wompi checkout:", err);
        setBusy(false);
        if (err && ["price_mismatch", "unknown_product", "product_without_price", "invalid_item", "invalid_qty", "out_of_stock"].includes(err.code)) {
          const again = stikeSanitizeCart(stikeGetCart());
          if (again.changed) { stikeSaveCart(again.cart); cartNotes = again.notes; }
          render();
        }
        showPayError(payErrorMessage(err || {}));
      });
    }

    /* Avisos de "ajustamos tu carrito" (se muestran hasta recargar la pagina). */
    let cartNotes = [];
    function render() {
      const clean = stikeSanitizeCart(stikeGetCart());
      if (clean.changed) { stikeSaveCart(clean.cart); cartNotes = cartNotes.concat(clean.notes.filter(n => !cartNotes.includes(n))); }
      const cart = clean.cart;
      const mount = document.getElementById("cart-mount");

      if (!cart.length) {
        mount.innerHTML = `
        <div class="cart-empty">
          <div class="big"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div>
          <h2 style="font-size:34px;margin:10px 0">Tu carrito está vacío, parce</h2>
          <p style="color:var(--muted)">Échale repuestos, ropa o protecciones y vuelve aquí pa' cerrar tu compra.</p>
          <a class="btn cyan" href="tienda.html" style="margin-top:14px">Ir a la tienda</a>
        </div>
        <section class="section" style="padding:56px 0 0">
          <div class="section-head"><div><span class="kicker">Pa' arrancar</span><h2>Lo más vendido</h2></div><a class="link-more" href="tienda.html">Ver todo →</a></div>
          <div class="product-grid" id="empty-picks"></div>
        </section>`;
        // An empty cart is the highest-intent dead end on the site; give it
        // somewhere to go instead of a single button.
        const picks = STIKE_PRODUCTS.filter(p => !stikeIsOutOfStock(p)).slice(0, 3);
        const pickMount = document.getElementById("empty-picks");
        if (pickMount) pickMount.innerHTML = picks.map(stikeProductCard).join("");
        return;
      }

      const rows = cart.map(r => {
        const p = stikeFindProduct(r.slug);
        if (!p) return "";
        const key = stikeLineKey(r);
        const variantBits = [];
        if (r.size) variantBits.push(`Talla: ${r.size}`);
        if (r.color) variantBits.push(`Color: ${r.color}`);
        const sizeTag = variantBits.length ? `<span class="ci-size">${variantBits.join(" · ")}</span>` : "";
        const url = stikeProductUrl(p);
        const img = stikeImageForColor(p, r.color);
        return `
        <div class="cart-row" data-row="${key}">
          <div class="ci-img"><a href="${url}"><img src="${img}" alt="${p.n}"></a></div>
          <div>
            <div class="ci-brand">${p.brand}</div>
            <a href="${url}" class="ci-title">${p.n}</a>
            ${sizeTag}
            <div class="ci-price">${stikePrice(stikePriceFor(p, r.size || null, r.color || null))}</div>
          </div>
          <div class="ci-right">
            <div class="qty">
              <button data-dec="${key}" aria-label="Menos">−</button>
              <input type="text" value="${r.qty}" data-qty="${key}" inputmode="numeric" aria-label="Cantidad">
              <button data-inc="${key}" aria-label="Más">+</button>
            </div>
            <button class="remove" data-remove="${key}">✕ Quitar</button>
          </div>
        </div>`;
      }).join("");

      const subtotal = stikeCartTotal();
      const shipping = subtotal >= FREE_SHIP ? 0 : SHIP_COST;
      const total = subtotal + shipping;
      const missing = FREE_SHIP - subtotal;
      const ship = stikeGetShipping() || {};
      const escAttr = s => String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      const waLines = cart.map(r => {
        const p = stikeFindProduct(r.slug);
        if (!p) return "";
        const variantBits = [];
        if (r.size) variantBits.push(`Talla ${r.size}`);
        if (r.color) variantBits.push(`Color ${r.color}`);
        const variant = variantBits.length ? ` (${variantBits.join(", ")})` : "";
        return `• ${r.qty}x ${p.n}${variant}, ${stikePrice(stikePriceFor(p, r.size || null, r.color || null) * r.qty)}`;
      }).join("%0A");
      const waMsg = `Hola Stike! Quiero hacer este pedido:%0A${waLines}%0A%0ASubtotal: ${stikePrice(subtotal)}%0ATotal: ${stikePrice(total)}`;

      /* Cross-sell del carrito: una sugerencia por cada producto distinto
         que ya esta en el carrito (mismo motor que el PDP -- marca + pieza
         complementaria primero), nunca algo que ya este adentro. Un
         carrito con cosas adentro es la mejor senal de intencion que hay;
         dejarlo sin sugerencias (como estaba) regalaba el upsell mas facil. */
      const crossSellSeen = new Set(cart.map(r => r.slug));
      const crossSell = [];
      cart.forEach(r => {
        const cp = stikeFindProduct(r.slug);
        if (!cp) return;
        stikeRelatedProducts(cp, 3).forEach(x => {
          if (crossSell.length >= 3 || crossSellSeen.has(x.slug)) return;
          crossSellSeen.add(x.slug);
          crossSell.push(x);
        });
      });

      mount.innerHTML = `
      <div class="cart-layout">
        <div class="cart-items">
          ${cartNotes.length ? `<div class="cart-notice" role="status">${cartNotes.map(n => `<p>${n.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</p>`).join("")}</div>` : ""}
          ${subtotal < FREE_SHIP ? `<div class="ship-note">Te faltan <b>${stikePrice(missing)}</b> para el <b>envío gratis</b>.</div>` : `<div class="ship-note"><b>Envío gratis</b> aplicado a tu pedido.</div>`}
          ${rows}
          <a href="tienda.html" class="link-more" style="margin-top:8px;display:inline-block">← Seguir comprando</a>
        </div>
        <aside class="summary">
          <h3>Resumen</h3>
          <div class="line"><span>Subtotal</span><span>${stikePrice(subtotal)}</span></div>
          <div class="line"><span>Envío</span><span>${shipping === 0 ? "Gratis" : stikePrice(shipping)}</span></div>
          <div class="line total"><span>Total</span><span>${stikePrice(total)}</span></div>
          <div class="co-form" id="ship-form" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
            <label for="ship-name" style="margin-bottom:0">Datos de envío</label>
            <input type="text" id="ship-name" placeholder="Nombre completo" value="${escAttr(ship.name)}">
            <input type="tel" id="ship-phone" placeholder="Teléfono / WhatsApp" value="${escAttr(ship.phone)}">
            <input type="text" id="ship-address" placeholder="Dirección" value="${escAttr(ship.address)}">
            <input type="text" id="ship-city" placeholder="Ciudad / Barrio" value="${escAttr(ship.city)}">
            <input type="text" id="ship-notes" placeholder="Notas para la entrega (opcional)" value="${escAttr(ship.notes)}">
          </div>
          <a class="btn wa block" style="margin-top:16px" href="https://wa.me/${STIKE_CONFIG.whatsapp}?text=${waMsg}" target="_blank" rel="noopener">Finalizar por WhatsApp</a>
          <button class="btn block" id="pay-btn" style="margin-top:10px" onclick="handlePagarAhora(${total})">Pagar ahora</button>
          <div class="pay-error" id="pay-error" role="alert" hidden></div>
          <div class="pay-cart">${stikePayStrip(true)}${stikeWompiBadge(true)}</div>
        </aside>
      </div>
      ${crossSell.length ? `
      <section class="section" style="padding:40px 0 0">
        <div class="section-head"><div><span class="kicker">Completa tu pedido</span><h2>También te puede interesar</h2></div></div>
        <div class="product-grid">${crossSell.map(stikeProductCard).join("")}</div>
      </section>` : ""}`;

      // Eventos
      mount.querySelectorAll("[data-inc]").forEach(b => b.addEventListener("click", () => { const k=b.getAttribute("data-inc"); const c=stikeGetCart().find(x=>stikeLineKey(x)===k); stikeUpdateQty(k,(c?c.qty:1)+1); render(); }));
      mount.querySelectorAll("[data-dec]").forEach(b => b.addEventListener("click", () => { const k=b.getAttribute("data-dec"); const c=stikeGetCart().find(x=>stikeLineKey(x)===k); stikeUpdateQty(k,(c?c.qty:1)-1); render(); }));
      mount.querySelectorAll("[data-qty]").forEach(inp => inp.addEventListener("change", () => { const k=inp.getAttribute("data-qty"); stikeUpdateQty(k, Math.max(1, parseInt(inp.value)||1)); render(); }));
      mount.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => { stikeRemoveFromCart(b.getAttribute("data-remove")); render(); }));

      // render() reconstruye todo el HTML (incluido el formulario de envío)
      // cada vez que cambia una cantidad -- sin esto, lo que el cliente
      // alcanzo a escribir pero no habia guardado se perdia al tocar + o -.
      ["ship-name", "ship-phone", "ship-address", "ship-city", "ship-notes"].forEach(id => {
        $ship(id).addEventListener("input", () => stikeSaveShipping({
          name: $ship("ship-name").value, phone: $ship("ship-phone").value,
          address: $ship("ship-address").value, city: $ship("ship-city").value,
          notes: $ship("ship-notes").value,
        }));
      });
    }
    render();
  </script>
