<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
<base href="/stike-x7k2m9/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito: Stike Bike Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=33">
  <link rel="icon" href="assets/img/favicon.png">
</head>
<body>
  <div id="site-header"></div>

  <div class="wrap page-head">
    <nav class="breadcrumb"><a href="index.html">Inicio</a><span class="sep">/</span><span>Carrito</span></nav>
    <h1>Tu carrito</h1>
  </div>

  <div class="wrap" id="cart-mount"></div>

  <div id="site-footer"></div>

  <script src="assets/js/products-data.js?v=3"></script>
  <script src="assets/js/data.js?v=3"></script>
  <script src="assets/js/app.js?v=9"></script>
  <script src="assets/js/wompi.js?v=2"></script>
  <script>
    stikeInit();
    const FREE_SHIP = 300000;
    const SHIP_COST = 18000;

    /* ---------------------- Pago (pasarela simulada) --------------------- */
    let checkoutOverlay;
    function ensureCheckoutOverlay() {
      if (checkoutOverlay) return checkoutOverlay;
      checkoutOverlay = document.createElement("div");
      checkoutOverlay.className = "checkout-overlay";
      document.body.appendChild(checkoutOverlay);
      checkoutOverlay.addEventListener("click", e => { if (e.target === checkoutOverlay) closeCheckout(); });
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeCheckout(); });
      return checkoutOverlay;
    }
    function closeCheckout() { if (checkoutOverlay) checkoutOverlay.classList.remove("open"); }

    /* TEMPORAL: mientras se prueba el flujo completo de Wompi contra el
       sandbox real, el boton manda al checkout real de Wompi (sandbox,
       no cobra nada) tanto en el sitio en vivo como en local -- la firma
       la hace el backend temporal en Vercel (ver assets/js/wompi.js).
       Cuando se confirme que todo funciona y se migre a Hostinger, esto
       vuelve a la pasarela simulada o pasa a /api/wompi-sign.php segun
       se decida. */
    /* El pago en si no dice a donde entregar -- Wompi solo sabe monto y
       referencia -- asi que estos datos se piden aca, antes de salir del
       sitio, y se guardan en localStorage (sobreviven el viaje de ida y
       vuelta a checkout.wompi.co) para que pago-resultado.html los pueda
       mandar junto con el pedido. */
    function readShippingForm() {
      const name = $ship("ship-name"), phone = $ship("ship-phone"), address = $ship("ship-address"), city = $ship("ship-city");
      if (!name.value.trim() || !phone.value.trim() || !address.value.trim() || !city.value.trim()) {
        const firstEmpty = [name, phone, address, city].find(el => !el.value.trim());
        firstEmpty.focus();
        stikeToast("Completa tus datos de envío antes de pagar");
        return null;
      }
      return {
        name: name.value.trim(), phone: phone.value.trim(),
        address: address.value.trim(), city: city.value.trim(),
        notes: $ship("ship-notes").value.trim(),
      };
    }
    function $ship(id) { return document.getElementById(id); }

    function handlePagarAhora(total) {
      const shipInfo = readShippingForm();
      if (!shipInfo) return;
      stikeSaveShipping(shipInfo);

      if (typeof stikeWompiCheckout === "function") {
        stikeWompiCheckout(total).catch(err => {
          console.error("wompi checkout:", err);
          stikeToast("Error al iniciar el pago con Wompi -- revisa la consola");
        });
        return;
      }
      openCheckout(total);
    }

    function openCheckout(total) {
      const ov = ensureCheckoutOverlay();
      ov.innerHTML = `
        <div class="checkout-modal">
          <button class="co-close" aria-label="Cerrar" onclick="closeCheckout()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          <h3>Pago con tarjeta</h3>
          <div class="co-demo-note">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Pasarela simulada (demo): no se procesan cobros reales ni se guardan datos de tarjeta.</span>
          </div>
          <div class="co-total-line"><span>Total a pagar</span><b>${stikePrice(total)}</b></div>
          <form class="co-form" id="co-form" autocomplete="off">
            <div>
              <label for="co-name">Nombre en la tarjeta</label>
              <input id="co-name" type="text" placeholder="Como aparece en la tarjeta" required>
            </div>
            <div>
              <label for="co-number">Número de tarjeta</label>
              <input id="co-number" type="text" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>
            <div class="co-row2">
              <div>
                <label for="co-exp">Vencimiento</label>
                <input id="co-exp" type="text" inputmode="numeric" placeholder="MM/AA" maxlength="5" required>
              </div>
              <div>
                <label for="co-cvv">CVV</label>
                <input id="co-cvv" type="text" inputmode="numeric" placeholder="123" maxlength="4" required>
              </div>
            </div>
            <button type="submit" class="btn block co-pay-btn"><span class="co-label">Pagar ${stikePrice(total)}</span><span class="co-spinner"></span></button>
          </form>
        </div>`;
      ov.classList.add("open");

      const numEl = document.getElementById("co-number");
      numEl.addEventListener("input", () => {
        numEl.value = numEl.value.replace(/[^0-9]/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
      });
      const expEl = document.getElementById("co-exp");
      expEl.addEventListener("input", () => {
        let v = expEl.value.replace(/[^0-9]/g, "").slice(0, 4);
        if (v.length > 2) v = v.slice(0, 2) + "/" + v.slice(2);
        expEl.value = v;
      });
      const cvvEl = document.getElementById("co-cvv");
      cvvEl.addEventListener("input", () => { cvvEl.value = cvvEl.value.replace(/[^0-9]/g, "").slice(0, 4); });

      document.getElementById("co-form").addEventListener("submit", e => {
        e.preventDefault();
        const btn = e.target.querySelector(".co-pay-btn");
        if (btn.classList.contains("loading")) return;
        btn.classList.add("loading");
        setTimeout(() => showCheckoutSuccess(total), 1400);
      });
    }

    function showCheckoutSuccess(total) {
      const orderNo = "STK-" + Date.now().toString().slice(-6);
      const modal = checkoutOverlay.querySelector(".checkout-modal");
      modal.innerHTML = `
        <button class="co-close" aria-label="Cerrar" onclick="closeCheckout()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <div class="co-success">
          <div class="co-check"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></div>
          <h3>¡Pago exitoso!</h3>
          <div class="co-order-no">Pedido ${orderNo}</div>
          <p>Pagaste ${stikePrice(total)} (simulado). Te escribiremos por WhatsApp para confirmar tu pedido.</p>
          <button class="btn block" onclick="finishCheckout()">Volver a la tienda</button>
        </div>`;
    }

    function finishCheckout() {
      stikeSaveCart([]);
      closeCheckout();
      render();
    }

    function render() {
      const cart = stikeGetCart();
      const mount = document.getElementById("cart-mount");

      if (!cart.length) {
        mount.innerHTML = `
        <div class="cart-empty">
          <div class="big"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div>
          <h2 style="font-size:34px;margin:10px 0">Tu carrito está vacío</h2>
          <p style="color:var(--muted)">Agrega repuestos, ropa o protecciones y vuelve aquí para terminar tu compra.</p>
          <a class="btn cyan" href="tienda.html" style="margin-top:14px">Ir a la tienda</a>
        </div>
        <section class="section" style="padding:56px 0 0">
          <div class="section-head"><div><span class="kicker">Para arrancar</span><h2>Lo más vendido</h2></div><a class="link-more" href="tienda.html">Ver todo →</a></div>
          <div class="product-grid" id="empty-picks"></div>
        </section>`;
        // An empty cart is the highest-intent dead end on the site; give it
        // somewhere to go instead of a single button.
        const picks = STIKE_PRODUCTS.filter(p => !stikeIsOutOfStock(p)).slice(0, 3);
        const pickMount = document.getElementById("empty-picks");
        if (pickMount) pickMount.innerHTML = picks.map(stikeProductCard).join("");
        return;
      }

      const rows = cart.map(r => {
        const p = stikeFindProduct(r.slug);
        if (!p) return "";
        const key = stikeLineKey(r);
        const variantBits = [];
        if (r.size) variantBits.push(`Talla: ${r.size}`);
        if (r.color) variantBits.push(`Color: ${r.color}`);
        const sizeTag = variantBits.length ? `<span class="ci-size">${variantBits.join(" · ")}</span>` : "";
        const url = stikeProductUrl(p);
        const img = stikeImageForColor(p, r.color);
        return `
        <div class="cart-row" data-row="${key}">
          <div class="ci-img"><a href="${url}"><img src="${img}" alt="${p.n}"></a></div>
          <div>
            <div class="ci-brand">${p.brand}</div>
            <a href="${url}" class="ci-title">${p.n}</a>
            ${sizeTag}
            <div class="ci-price">${stikePrice(p.price)}</div>
          </div>
          <div class="ci-right">
            <div class="qty">
              <button data-dec="${key}" aria-label="Menos">−</button>
              <input type="text" value="${r.qty}" data-qty="${key}" inputmode="numeric" aria-label="Cantidad">
              <button data-inc="${key}" aria-label="Más">+</button>
            </div>
            <button class="remove" data-remove="${key}">✕ Quitar</button>
          </div>
        </div>`;
      }).join("");

      const subtotal = stikeCartTotal();
      const shipping = subtotal >= FREE_SHIP ? 0 : SHIP_COST;
      const total = subtotal + shipping;
      const missing = FREE_SHIP - subtotal;
      const ship = stikeGetShipping() || {};
      const escAttr = s => String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      const waLines = cart.map(r => {
        const p = stikeFindProduct(r.slug);
        if (!p) return "";
        const variantBits = [];
        if (r.size) variantBits.push(`Talla ${r.size}`);
        if (r.color) variantBits.push(`Color ${r.color}`);
        const variant = variantBits.length ? ` (${variantBits.join(", ")})` : "";
        return `• ${r.qty}x ${p.n}${variant}, ${stikePrice(p.price * r.qty)}`;
      }).join("%0A");
      const waMsg = `Hola Stike! Quiero hacer este pedido:%0A${waLines}%0A%0ASubtotal: ${stikePrice(subtotal)}%0ATotal: ${stikePrice(total)}`;

      mount.innerHTML = `
      <div class="cart-layout">
        <div class="cart-items">
          ${subtotal < FREE_SHIP ? `<div class="ship-note">Te faltan <b>${stikePrice(missing)}</b> para el <b>envío gratis</b>.</div>` : `<div class="ship-note"><b>Envío gratis</b> aplicado a tu pedido.</div>`}
          ${rows}
          <a href="tienda.html" class="link-more" style="margin-top:8px;display:inline-block">← Seguir comprando</a>
        </div>
        <aside class="summary">
          <h3>Resumen</h3>
          <div class="line"><span>Subtotal</span><span>${stikePrice(subtotal)}</span></div>
          <div class="line"><span>Envío</span><span>${shipping === 0 ? "Gratis" : stikePrice(shipping)}</span></div>
          <div class="promo-input">
            <input type="text" placeholder="Código promo" id="promo">
            <button class="btn sm" onclick="stikeToast('Código aplicado en el pago')">Aplicar</button>
          </div>
          <div class="line total"><span>Total</span><span>${stikePrice(total)}</span></div>
          <div class="co-form" id="ship-form" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
            <label for="ship-name" style="margin-bottom:0">Datos de envío</label>
            <input type="text" id="ship-name" placeholder="Nombre completo" value="${escAttr(ship.name)}">
            <input type="tel" id="ship-phone" placeholder="Teléfono / WhatsApp" value="${escAttr(ship.phone)}">
            <input type="text" id="ship-address" placeholder="Dirección" value="${escAttr(ship.address)}">
            <input type="text" id="ship-city" placeholder="Ciudad / Barrio" value="${escAttr(ship.city)}">
            <input type="text" id="ship-notes" placeholder="Notas para la entrega (opcional)" value="${escAttr(ship.notes)}">
          </div>
          <a class="btn wa block" style="margin-top:16px" href="https://wa.me/${STIKE_CONFIG.whatsapp}?text=${waMsg}" target="_blank" rel="noopener">Finalizar por WhatsApp</a>
          <button class="btn block" style="margin-top:10px" onclick="handlePagarAhora(${total})">Pagar ahora</button>
          <p style="color:var(--muted);font-size:12px;margin-top:14px;text-align:center">Pagos: Tarjeta · PSE · Nequi · Efecty</p>
        </aside>
      </div>`;

      // Eventos
      mount.querySelectorAll("[data-inc]").forEach(b => b.addEventListener("click", () => { const k=b.getAttribute("data-inc"); const c=stikeGetCart().find(x=>stikeLineKey(x)===k); stikeUpdateQty(k,(c?c.qty:1)+1); render(); }));
      mount.querySelectorAll("[data-dec]").forEach(b => b.addEventListener("click", () => { const k=b.getAttribute("data-dec"); const c=stikeGetCart().find(x=>stikeLineKey(x)===k); stikeUpdateQty(k,(c?c.qty:1)-1); render(); }));
      mount.querySelectorAll("[data-qty]").forEach(inp => inp.addEventListener("change", () => { const k=inp.getAttribute("data-qty"); stikeUpdateQty(k, Math.max(1, parseInt(inp.value)||1)); render(); }));
      mount.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => { stikeRemoveFromCart(b.getAttribute("data-remove")); render(); }));

      // render() reconstruye todo el HTML (incluido el formulario de envío)
      // cada vez que cambia una cantidad -- sin esto, lo que el cliente
      // alcanzo a escribir pero no habia guardado se perdia al tocar + o -.
      ["ship-name", "ship-phone", "ship-address", "ship-city", "ship-notes"].forEach(id => {
        $ship(id).addEventListener("input", () => stikeSaveShipping({
          name: $ship("ship-name").value, phone: $ship("ship-phone").value,
          address: $ship("ship-address").value, city: $ship("ship-city").value,
          notes: $ship("ship-notes").value,
        }));
      });
    }
    render();
  </script>
  <script src="assets/js/animations.js?v=5"></script>
</body>
</html>
