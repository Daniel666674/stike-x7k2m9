name: Publish to Hostinger

# Cada vez que el panel admin publica (cada commit a la rama de trabajo), arma
# la copia limpia del sitio (sin datos internos ni herramientas, ver
# tools/stage-hostinger.sh) y la deja en la rama "hostinger-deploy". Hostinger
# (hPanel > Avanzado > Git) esta conectado a esa rama: GitHub le avisa con un
# webhook y Hostinger descarga los cambios solo. No hay contrasenas FTP ni
# secrets de ningun tipo: este workflow solo usa el token que GitHub ya le da.
#
# Tambien se puede correr a mano: Actions > Publish to Hostinger > Run workflow.
#
# api/config.local.php (los secretos del servidor) no esta en el repo, asi que
# la rama no lo trae y el "git pull" de Hostinger nunca lo toca ni lo borra.
on:
  push:
    branches: ["claude/sweet-albattani-ti0w0e"]
  workflow_dispatch:

permissions:
  contents: write

# Publicaciones seguidas del panel se juntan en un solo deploy del estado final.
concurrency:
  group: "hostinger"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish clean copy to hostinger-deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish-hostinger.sh "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger-deploy
