name: Publish to Hostinger

# Cada vez que el panel admin publica (cada commit a la rama de trabajo), arma
# la copia limpia del sitio (sin datos internos ni herramientas, ver
# tools/stage-hostinger.sh) y la deja en la rama "hostinger-deploy". De ahi en
# mas hay dos caminos, no exclusivos, cada uno activado solo si sus secrets
# existen:
#   - FTP (HOSTINGER_FTP_*): este workflow sube los archivos directo.
#   - Aviso (HOSTINGER_SYNC_TOKEN): le avisa a stikebikeshop.com/api/sync y el
#     SERVIDOR baja el commit de GitHub por su cuenta.
# Si algun dia el "Git" de hPanel funciona, tambien puede apuntar a esa rama.
#
# Secrets del repo (Settings > Secrets and variables > Actions):
#   HOSTINGER_SYNC_TOKEN   el mismo SYNC_TOKEN que esta en api/config.local.php
#                          del servidor. Sin el, el paso de aviso se salta y la
#                          rama igual se actualiza (el sitio no).
#   HOSTINGER_FTP_HOST     host/usuario/clave de la cuenta FTP de Hostinger
#   HOSTINGER_FTP_USER     (hPanel > Archivos > Cuentas FTP). Opcionales: si no
#   HOSTINGER_FTP_PASS     estan, este paso se salta solo. Suben los archivos
#                          DIRECTO por FTP (no dependen de que api/sync.php ya
#                          exista en el servidor -- por eso tambien sirven para
#                          instalarlo la primera vez, sin pasar por
#                          instalar-hostinger.php).
#
# Tambien se puede correr a mano: Actions > Publish to Hostinger > Run workflow.
#
# api/config.local.php (los secretos del servidor) no esta en el repo, asi que
# la rama no lo trae y ni el FTP, ni el sync, ni un "git pull" de Hostinger lo
# tocan o borran (ver --exclude-glob abajo).
on:
  push:
    branches: ["claude/sweet-albattani-ti0w0e"]
  workflow_dispatch:

permissions:
  contents: write

# Publicaciones seguidas del panel se juntan en un solo deploy del estado final.
concurrency:
  group: "hostinger"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish clean copy to hostinger-deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/publish-hostinger.sh "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger-deploy

      - name: Upload to Hostinger via FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASS }}
        run: |
          if [ -z "$FTP_HOST" ]; then echo "HOSTINGER_FTP_HOST no esta definido: se salta la subida por FTP."; exit 0; fi
          tools/stage-hostinger.sh /tmp/ftp-stage
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # mirror -R sin --delete: sube y sobreescribe, NUNCA borra lo que ya
          # esta en el servidor y no vino en esta copia (red de seguridad
          # aparte de --exclude-glob, por si config.local.php llegara a
          # colarse en el stage).
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<'EOF'
          mirror -R --verbose --exclude-glob=config.local.php /tmp/ftp-stage/ ./
          bye
          EOF

      - name: Tell Hostinger to update
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.HOSTINGER_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then echo "HOSTINGER_SYNC_TOKEN no esta definido: se salta el aviso al sitio."; exit 0; fi
          SHA="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/hostinger-deploy | cut -f1)"
          echo "Avisando a stikebikeshop.com del commit ${SHA}"
          curl -sS --fail-with-body --max-time 300 -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"sha\":\"${SHA}\"}" https://stikebikeshop.com/api/sync
          echo
